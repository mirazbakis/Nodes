<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'" />
  <title>Screen control</title>
  <link rel="stylesheet" href="screen.css" />
</head>
<body data-page="screen-bar">
  <div class="sbar" role="status" aria-live="polite">
    <span class="dot" aria-hidden="true"></span>
    <span class="msg"><b id="who">A node</b> is controlling your screen</span>
    <span class="key" id="key"></span>
    <button id="stop" type="button">Stop</button>
  </div>
  <script src="screen.js"></script>
</body>
</html>
