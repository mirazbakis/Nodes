name: Release

# Builds Nodes and publishes a GitHub release for the version in package.json.
# Runs on every push to main; does nothing if that version is already released.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Build
        if: steps.version.outputs.exists == 'false'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npm run dist -- --publish never

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        run: |
          V="${{ steps.version.outputs.version }}"
          gh release create "v$V" dist/*.dmg dist/*.zip \
            --title "Nodes $V" \
            --notes "A team of AI engineers on your Mac that runs on every model you have, and never stops answering.

          **Install:** download the \`.dmg\` for your Mac (\`arm64\` for Apple silicon, \`x64\` for Intel), open it and drag Nodes to Applications. On first launch macOS may block it: open System Settings › Privacy & Security and click **Open Anyway**."
