name: Release

# Builds Nodes and publishes a GitHub release for the version in package.json.
# Runs on every push to main. If that version is already released, the release
# is rebuilt and replaced so it always matches the latest commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels a release build that's still running.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Build
        if: steps.version.outputs.exists == 'false'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npm run dist -- --publish never

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        run: |
          V="${{ steps.version.outputs.version }}"
          gh release delete "v$V" --cleanup-tag --yes 2>/dev/null || true
          gh release create "v$V" dist/*.dmg dist/*.zip \
            --title "Nodes $V" \
            --notes "A team of AI engineers on your Mac that runs on every model you have, and never stops answering.

          **Install:** download the \`.dmg\` for your Mac (\`arm64\` for Apple silicon, \`x64\` for Intel), open it and drag Nodes to Applications. On first launch macOS may block it: open System Settings › Privacy & Security and click **Open Anyway**."
