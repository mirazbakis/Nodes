name: Release

# Builds Nodes for macOS and Windows and publishes a GitHub release for the
# version in package.json. Runs on every push to main. If that version is
# already released, the release is rebuilt and replaced so it always matches
# the latest commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels a release build that's still running.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add sign-in keys
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
        run: |
          node -e "const e=process.env; require('fs').writeFileSync('src/oauth.local.json', JSON.stringify({googleClientId:e.GOOGLE_CLIENT_ID||'',googleClientSecret:e.GOOGLE_CLIENT_SECRET||'',githubClientId:e.GH_OAUTH_CLIENT_ID||''}))"

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npm run dist -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add sign-in keys
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
        run: |
          node -e "const e=process.env; require('fs').writeFileSync('src/oauth.local.json', JSON.stringify({googleClientId:e.GOOGLE_CLIENT_ID||'',googleClientSecret:e.GOOGLE_CLIENT_SECRET||'',githubClientId:e.GH_OAUTH_CLIENT_ID||''}))"

      - name: Build
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npm run dist:win -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        run: |
          V="${{ needs.mac.outputs.version }}"
          ls -la out
          gh release delete "v$V" --cleanup-tag --yes 2>/dev/null || true
          gh release create "v$V" out/* \
            --target "${{ github.sha }}" \
            --title "Nodes $V" \
            --notes "A team of AI engineers on your computer that runs on every model you have, and never stops answering.

          **macOS:** download the \`.dmg\` for your Mac (\`arm64\` for Apple silicon, \`x64\` for Intel), open it and drag Nodes to Applications. On first launch macOS may block it: open System Settings › Privacy & Security and click **Open Anyway**.

          **Windows:** download \`Nodes-$V-x64-setup.exe\` (or \`arm64\` for Windows on ARM) and run it, or use \`Nodes-$V-portable.exe\` to run without installing. Windows SmartScreen may warn because the app isn't signed: click **More info** › **Run anyway**."
